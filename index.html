  function setAuthError(msg) {
    var el = document.getElementById('authErr');
    if (el) { el.textContent = msg; el.style.display = 'block'; }
    else { toast(msg); }
  }

  function addToBagFromDetail() {
    var d = ui.detail;
    if (!d) return false;
    var p = productById(d.id);
    if (!p) return false;
    var m = currentMember();
    if (!m) {
      closeModal();
      ui.mode = 'auth'; ui.authTab = 'login'; ui.authError = '';
      renderAll(); scrollTop();
      toast('로그인하고 담아주세요');
      return false;
    }
    var rs = roundState(roundById(p.roundId));
    if (rs.closed) { toast('마감된 회차예요'); return false; }
    if (isSoldOut(p)) { toast('품절된 상품이에요'); return false; }
    var items = bagOf(m);
    var opt = d.opt || ((p.options && p.options[0]) || '');
    var want = Math.max(1, num(d.qty) || 1);
    var lim = stockLeft(p);
    var already = 0;
    items.forEach(function (it) { if (it.pid === p.id) already += num(it.qty); });
    if (lim !== null && already + want > lim) {
      toast('재고가 부족해요 · 남은 ' + lim + '개 (장바구니 ' + already + '개)');
      return false;
    }
    var found = null;
    items.forEach(function (it) { if (it.pid === p.id && (it.opt || '') === (opt || '')) found = it; });
    if (found) found.qty = num(found.qty) + want;
    else items.push({ pid: p.id, opt: opt, qty: want });
    save();
    return true;
  }

  function copyText(text, okMsg) {
    var msg = okMsg || '복사했어요';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(msg); }, function () { legacyCopy(text, msg); });
    } else {
      legacyCopy(text, msg);
    }
  }
  function legacyCopy(text, msg) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', 'readonly');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      toast(ok ? msg : '복사하지 못했어요. CSV 다운로드를 써주세요.');
    } catch (e) {
      toast('복사하지 못했어요. CSV 다운로드를 써주세요.');
    }
  }

  function downloadCsv() {
    var rows = exportRows();
    if (!rows.length) { toast('내보낼 주문이 없어요'); return; }
    try {
      var text = '\ufeff' + csvText(rows);
      var blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '체리니바잉_' + todayStr() + '.csv';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        try { URL.revokeObjectURL(url); } catch (e) {}
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 900);
      toast('CSV 파일을 내려받았어요');
    } catch (e) {
      toast('다운로드를 만들지 못했어요. 시트용 복사를 써주세요.');
    }
  }

  function doClaim(id) {
    var m = currentMember();
    var o = null;
    state.orders.forEach(function (x) { if (x.id === id) o = x; });
    if (!o) return;
    if (!m || o.memberId !== m.id) { toast('본인 주문만 요청할 수 있어요'); return; }
    if (o.status !== 'unpaid') { toast('이미 처리된 주문이에요'); return; }
    addLog(o, 'claim');
    save();
    renderAll();
    toast('입금 확인 요청을 보냈어요!');
  }

  function action(act, d, el) {
    d = d || {};
    var m = currentMember();
    var i, o, p, r, list;

    switch (act) {
      case 'mode':
        setMode(d.mode || 'guest');
        break;

      case 'tab':
        if (ui.mode === 'admin') ui.adminTab = d.tab;
        else ui.guestTab = d.tab;
        ui.modal = null; ui.detail = null;
        renderAll();
        scrollTop();
        break;

      case 'authTab':
        ui.authTab = d.tab || 'login';
        ui.pendingId = null;
        ui.authError = '';
        renderAll();
        break;

      case 'goAuth':
        ui.mode = 'auth';
        ui.authTab = d.tab || 'login';
        ui.authError = '';
        ui.pendingId = null;
        renderAll();
        scrollTop();
        break;

      case 'goHome':
        ui.mode = 'guest';
        ui.guestTab = 'home';
        renderAll();
        scrollTop();
        break;

      case 'goApprove':
        ui.mode = 'admin';
        ui.adminTab = 'members';
        renderAll();
        scrollTop();
        break;

      case 'enterGuest':
        var pm = ui.pendingId ? memberById(ui.pendingId) : currentMember();
        if (pm && pm.status === 'approved') {
          state.session = { role: 'member', memberId: pm.id };
          state.lastSignupId = null;
          save();
        }
        ui.pendingId = null;
        ui.mode = 'guest';
        ui.guestTab = 'home';
        renderAll();
        scrollTop();
        toast(pm ? pm.name + '님, 어서 오세요!' : '어서 오세요!');
        break;

      case 'backToLogin':
        ui.pendingId = null;
        ui.mode = 'auth';
        ui.authTab = 'login';
        ui.authError = '';
        renderAll();
        break;

      case 'fillDemo':
        fillDemo(d.user);
        break;

      case 'homeRound':
        ui.homeRoundId = d.id;
        render();
        break;

      case 'openProduct':
        p = productById(d.id);
        if (!p) return;
        ui.detail = { id: p.id, opt: (p.options && p.options[0]) || '', qty: 1 };
        openModal('product');
        break;

      case 'opt':
        if (!ui.detail) return;
        ui.detail.opt = d.opt || '';
        renderModal();
        break;

      case 'qty':
        if (!ui.detail) return;
        var dq = num(d.delta);
        var dlim = stockLeft(productById(ui.detail.id));
        var nextQ = Math.max(1, num(ui.detail.qty) + dq);
        if (dq > 0 && dlim !== null && nextQ > dlim) { toast('재고가 ' + dlim + '개 남았어요'); return; }
        ui.detail.qty = nextQ;
        renderModal();
        break;

      case 'addCart':
        if (addToBagFromDetail()) { closeModal(); renderAll(); toast('장바구니에 담았어요'); }
        break;

      case 'buyNow':
        if (addToBagFromDetail()) {
          closeModal();
          ui.mode = 'guest';
          ui.guestTab = 'cart';
          renderAll();
          scrollTop();
        }
        break;

      case 'cartQty':
        list = bag();
        i = num(d.i);
        if (!list[i]) return;
        var cdelta = num(d.delta);
        var cp = productById(list[i].pid);
        if (cdelta > 0) {
          if (isSoldOut(cp)) { toast('품절된 상품이에요'); return; }
          var clim = stockLeft(cp);
          if (clim !== null && num(list[i].qty) + cdelta > clim) {
            toast('재고가 부족해요 · 남은 ' + clim + '개');
            return;
          }
        }
        list[i].qty = num(list[i].qty) + cdelta;
        if (list[i].qty <= 0) list.splice(i, 1);
        save();
        render();
        break;

      case 'cartDel':
        list = bag();
        i = num(d.i);
        if (!list[i]) return;
        list.splice(i, 1);
        save();
        render();
        toast('장바구니에서 삭제했어요');
        break;

      case 'openCheckout':
        if (!m) { ui.mode = 'auth'; ui.authTab = 'login'; renderAll(); toast('로그인해 주세요'); return; }
        if (!bag().length) { toast('장바구니가 비어 있어요'); return; }
        var bp = bagProblem();
        if (bp) { toast('재고를 확인해 주세요: ' + bp); return; }
        openModal('checkout');
        break;

      case 'claim':
        doClaim(d.id);
        break;

      case 'copyAccount':
        copyText(state.settings.account + ' ' + state.settings.holder, '계좌를 복사했어요');
        break;

      case 'logout':
        state.session = null;
        save();
        ui.mode = 'guest';
        ui.guestTab = 'home';
        renderAll();
        scrollTop();
        toast('로그아웃했어요');
        break;

      case 'pccc':
        ui.pcccShow = !ui.pcccShow;
        render();
        break;

      case 'filter':
        ui.orderFilter = d.filter || 'all';
        render();
        break;

      case 'deposit':
        state.orders.forEach(function (x) { if (x.id === d.id) o = x; });
        if (!o) return;
        if (o.status === 'paid' || o.status === 'shipped') { toast('이미 입금 확인된 주문이에요'); return; }
        addLog(o, 'paid');
        save();
        renderAll();
        toast('입금 확인 처리했어요 · ' + won(o.total));
        break;

      case 'ship':
        state.orders.forEach(function (x) { if (x.id === d.id) o = x; });
        if (!o) return;
        if (o.status !== 'paid') { toast('입금 확인 후 배송 시작할 수 있어요'); return; }
        addLog(o, 'shipped');
        save();
        renderAll();
        toast('배송중으로 바꿨어요');
        break;

      case 'delOrder':
        if (typeof confirm === 'function' && !confirm('이 주문을 삭제할까요?\n삭제하면 되돌릴 수 없어요. 재고가 관리되는 상품은 수량이 다시 채워져요.')) return;
        o = null;
        state.orders.forEach(function (x) { if (x.id === d.id) o = x; });
        if (!o) return;
        var back = restoreStock(o);
        state.orders = state.orders.filter(function (x) { return x.id !== d.id; });
        save();
        renderAll();
        toast(back ? '주문을 삭제하고 재고 ' + back + '개를 되돌렸어요' : '주문을 삭제했어요');
        break;

      case 'stockAdj':
        p = productById(d.id);
        if (!p) return;
        var adj = num(d.d);
        var sc = stockLeft(p);
        if (sc === null) { toast('무제한 상품이에요. 수정에서 재고 수량을 넣어 주세요'); return; }
        var nv = Math.max(0, sc + adj);
        if (nv === sc) { toast('재고가 0개라 더 줄일 수 없어요'); return; }
        p.stock = nv;
        save();
        renderAll();
        toast(p.name + ' · 재고 ' + nv + '개' + (adj > 0 ? ' (+' + adj + ')' : ' (' + adj + ')') +
          (p.soldOut && nv > 0 ? ' · 품절 표시를 풀어 주세요' : ''));
        break;

      case 'stockToggle':
        p = productById(d.id);
        if (!p) return;
        if (isSoldOut(p)) {
          var tl = stockLeft(p);
          if (tl !== null && tl <= 0) { toast('재고가 0개예요. 수량을 먼저 늘려 주세요'); return; }
          p.soldOut = false;
          toast(p.name + ' · 판매를 다시 시작해요');
        } else {
          p.soldOut = true;
          toast(p.name + ' · 품절로 표시했어요');
        }
        save();
        renderAll();
        break;

      case 'depositMember':
        var need = state.orders.filter(function (x) {
          return x.memberId === d.id && (x.status === 'unpaid' || x.status === 'claim');
        });
        if (!need.length) { toast('미입금 주문이 없어요'); return; }
        if (typeof confirm === 'function' && !confirm(memberName(d.id) + '님의 미입금 ' + need.length + '건을 입금 확인 처리할까요?')) return;
        need.forEach(function (x) { addLog(x, 'paid'); });
        save();
        renderAll();
        toast(need.length + '건 입금 확인 처리했어요');
        break;

      case 'newRound':
        ui.draft = {
          mode: 'new', id: null, title: '', memo: '',
          deadline: fmtInput(new Date(Date.now() + 72 * 3600 * 1000).toISOString()),
          status: 'open'
        };
        openModal('roundForm');
        break;

      case 'editRound':
        r = roundById(d.id);
        if (!r) return;
        ui.draft = { mode: 'edit', id: r.id, title: r.title, memo: r.memo || '', deadline: fmtInput(r.deadline), status: r.status };
        openModal('roundForm');
        break;

      case 'toggleRound':
        r = roundById(d.id);
        if (!r) return;
        if (!roundState(r).closed) {
          if (typeof confirm === 'function' && !confirm('‘' + r.title + '’ 회차를 지금 마감할까요?\n손님은 더 이상 주문할 수 없어요.')) return;
          r.status = 'closed';
          save();
          renderAll();
          toast('회차를 마감했어요');
        } else {
          ui.draft = {
            mode: 'edit', id: r.id, title: r.title, memo: r.memo || '',
            deadline: fmtInput(new Date(Date.now() + 72 * 3600 * 1000).toISOString()),
            status: 'open'
          };
          openModal('roundForm');
          toast('다시 열려면 마감 시간을 새로 정해 주세요');
        }
        break;

      case 'adminRound':
        ui.adminRoundId = d.id;
        render();
        break;

      case 'newProduct':
        var rs0 = roundsSorted();
        var baseRound = ui.adminRoundId ? roundById(ui.adminRoundId) : rs0[0];
        if (!baseRound) { toast('회차를 먼저 만들어 주세요'); return; }
        ui.draft = {
          mode: 'new', id: null, roundId: baseRound.id, image: '',
          name: '', desc: '', price: '', costJpy: '', optionsText: '', badge: '',
          stockText: '', soldOut: false
        };
        openModal('productForm');
        break;

      case 'editProduct':
        p = productById(d.id);
        if (!p) return;
        var pl = stockLeft(p);
        ui.draft = {
          mode: 'edit', id: p.id, roundId: p.roundId, image: p.image,
          name: p.name, desc: p.desc || '', price: p.price, costJpy: p.costJpy || '',
          optionsText: (p.options || []).join(', '), badge: p.badge || '',
          stockText: pl === null ? '' : String(pl), soldOut: !!p.soldOut
        };
        openModal('productForm');
        break;

      case 'sample':
        if (!ui.draft) return;
        ui.draft.image = sampleImage(d.key);
        renderModal();
        break;

      case 'delProduct':
        p = productById(d.id);
        if (!p) return;
        if (typeof confirm === 'function' && !confirm('‘' + p.name + '’ 상품을 삭제할까요?')) return;
        state.products = state.products.filter(function (x) { return x.id !== d.id; });
        Object.keys(state.bags).forEach(function (k) {
          state.bags[k] = (state.bags[k] || []).filter(function (it) { return it.pid !== d.id; });
        });
        save();
        renderAll();
        toast('상품을 삭제했어요');
        break;

      case 'approve':
        var ap = memberById(d.id);
        if (!ap) return;
        ap.status = 'approved';
        ap.approvedAt = nowStr();
        if (state.lastSignupId === ap.id) {
          state.session = { role: 'member', memberId: ap.id };
          state.lastSignupId = null;
        }
        save();
        renderAll();
        toast(ap.name + '님 승인 완료! 손님 화면에서 확인해 보세요.');
        break;

      case 'reject':
        var rj = memberById(d.id);
        if (!rj) return;
        if (typeof confirm === 'function' && !confirm(rj.name + '님의 가입 신청을 거절할까요?')) return;
        rj.status = 'rejected';
        if (state.lastSignupId === rj.id) state.lastSignupId = null;
        save();
        renderAll();
        toast('가입 신청을 거절했어요');
        break;

      case 'memberInfo':
        openModal('member', { id: d.id });
        break;

      case 'downCsv':
        downloadCsv();
        break;

      case 'copyExport':
        var rows = exportRows();
        if (!rows.length) { toast('복사할 주문이 없어요'); return; }
        copyText(tsvText(rows), '복사했어요. 시트에 붙여넣어 주세요!');
        break;

      case 'resetData':
        if (typeof confirm === 'function' && !confirm('데모 데이터를 처음 상태로 되돌릴까요?\n지금까지 만든 회원·상품·주문이 사라져요.')) return;
        resetAll();
        break;

      case 'closeModal':
        closeModal();
        break;

      default:
        break;
    }
  }

  function resetAll() {
    state = seed();
    save();
    ui.mode = 'guest';
    ui.authTab = 'login';
    ui.authError = '';
    ui.pendingId = null;
    ui.guestTab = 'home';
    ui.adminTab = 'orders';
    ui.orderFilter = 'all';
    ui.adminRoundId = null;
    ui.homeRoundId = null;
    ui.detail = null;
    ui.modal = null;
    ui.draft = null;
    ui.expScope = 'all';
    ui.expHeader = true;
    ui.pcccShow = false;
    closeModal();
    renderAll();
    scrollTop();
    toast('처음 상태로 되돌렸어요');
  }

  function fillDemo(user) {
    var v = { seoyeon: { userId: 'seoyeon', password: '1234' }, haneul: { userId: 'haneul', password: '1234' } }[user];
    if (!v) return;
    var idEl = document.getElementById('lgId');
    var pwEl = document.getElementById('lgPw');
    if (idEl) idEl.value = v.userId;
    if (pwEl) pwEl.value = v.password;
    toast('체험 계정을 채웠어요. 로그인을 눌러 주세요.');
  }

  /* =========================================================
     제출 처리
     ========================================================= */
  function doLogin(data) {
    var uidv = String(data.userId || '').trim().toLowerCase();
    var pw = String(data.password || '');
    if (!uidv || !pw) { setAuthError('아이디와 비밀번호를 입력해 주세요.'); return; }
    var m = null;
    state.members.forEach(function (x) {
      if (String(x.userId).toLowerCase() === uidv) m = x;
    });
    if (!m) { setAuthError('아이디를 찾을 수 없어요. 다시 확인해 주세요.'); return; }
    if (String(m.password) !== pw) { setAuthError('비밀번호가 맞지 않아요.'); return; }

    state.autoLogin = !!data.remember;
    if (m.status === 'pending') {
      state.session = null;
      ui.pendingId = m.id;
      ui.authError = '';
      save();
      renderAll();
      scrollTop();
      return;
    }
    if (m.status === 'rejected') {
      ui.pendingId = m.id;
      ui.authError = '';
      renderAll();
      return;
    }
    state.session = { role: 'member', memberId: m.id };
    save();
    ui.pendingId = null;
    ui.authError = '';
    ui.mode = 'guest';
    ui.guestTab = 'home';
    renderAll();
    scrollTop();
    toast(m.name + '님, 어서 오세요!');
  }

  function doSignup(data) {
    var name = String(data.name || '').trim();
    var nickname = String(data.nickname || '').trim();
    var phone = String(data.phone || '').replace(/\s/g, '');
    var address = String(data.address || '').trim();
    var pccc = String(data.pccc || '').toUpperCase().replace(/[\s-]/g, '');
    var userId = String(data.userId || '').trim();
    var password = String(data.password || '');

    if (name.length < 2) { setAuthError('이름을 정확히 적어 주세요.'); return; }
    if (!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(phone)) { setAuthError('연락처를 010-0000-0000 형식으로 적어 주세요.'); return; }
    if (address.length < 5) { setAuthError('배송지 주소를 적어 주세요.'); return; }
    if (!/^P\d{12}$/.test(pccc)) { setAuthError('개인통관고유부호는 P로 시작하는 13자리예요. (예: P123456789012)'); return; }
    if (!/^[A-Za-z0-9_]{4,12}$/.test(userId)) { setAuthError('아이디는 영문·숫자 4~12자로 정해 주세요.'); return; }
    if (password.length < 4) { setAuthError('비밀번호는 4자 이상으로 정해 주세요.'); return; }
    var dup = false;
    state.members.forEach(function (x) { if (String(x.userId).toLowerCase() === userId.toLowerCase()) dup = true; });
    if (dup) { setAuthError('이미 쓰고 있는 아이디예요. 다른 아이디를 써 주세요.'); return; }
    if (!data.agree) { setAuthError('개인정보 수집에 동의해 주세요.'); return; }

    var m = {
      id: uid('mem'), name: name, nickname: nickname, phone: phone, address: address,
      pccc: pccc, userId: userId, password: password, status: 'pending',
      requestedAt: nowStr(), approvedAt: null
    };
    state.members.push(m);
    state.lastSignupId = m.id;
    save();
    ui.pendingId = m.id;
    ui.authError = '';
    ui.authTab = 'login';
    renderAll();
    scrollTop();
    toast('가입 신청이 접수됐어요!');
  }

  function doCheckout(data) {
    var m = currentMember();
    if (!m) {
      closeModal();
      ui.mode = 'auth'; ui.authTab = 'login'; renderAll();
      return;
    }
    var items = bagOf(m).filter(function (it) { return !!productById(it.pid); });
    if (!items.length) { toast('장바구니가 비어 있어요'); closeModal(); renderAll(); return; }

    var address = String(data.address || '').trim();
    var depositor = String(data.depositor || '').trim() || m.name;
    var memo = String(data.memo || '').trim();
    if (address.length < 5) { toast('배송지를 확인해 주세요'); return; }

    var closedName = null;
    items.forEach(function (it) {
      var p = productById(it.pid);
      var r = roundById(p.roundId);
      if (roundState(r).closed && !closedName) closedName = p.name + ' (' + (r ? r.title : '') + ')';
    });
    if (closedName) { toast('마감된 상품이 있어요: ' + closedName); return; }

    /* 재고 검사 — 옵션이 달라도 같은 상품은 수량을 합쳐서 본다 */
    var need = {};
    items.forEach(function (it) { need[it.pid] = (need[it.pid] || 0) + num(it.qty); });
    var shortage = null;
    Object.keys(need).forEach(function (pid) {
      if (shortage) return;
      var p = productById(pid);
      if (!p) return;
      if (isSoldOut(p)) { shortage = p.name + ' · 품절'; return; }
      var s = stockLeft(p);
      if (s !== null && need[pid] > s) shortage = p.name + ' · 남은 ' + s + '개';
    });
    if (shortage) { toast('재고가 부족해요: ' + shortage); return; }

    var groups = {};
    items.forEach(function (it) {
      var p = productById(it.pid);
      if (!groups[p.roundId]) groups[p.roundId] = [];
      groups[p.roundId].push(it);
    });

    var grand = 0;
    var count = 0;
    Object.keys(groups).forEach(function (rid) {
      var its = groups[rid].map(function (it) {
        var p = productById(it.pid);
        return { productId: p.id, name: p.name, option: it.opt || '', qty: num(it.qty), price: num(p.price) };
      });
      var total = its.reduce(function (s, x) { return s + x.price * x.qty; }, 0);
      var order = {
        id: uid('od'), no: nextOrderNo(), memberId: m.id, roundId: rid,
        items: its, total: total, status: 'unpaid', depositor: depositor,
        memo: memo, address: address, createdAt: nowStr(),
        logs: [{ status: 'unpaid', at: nowStr() }]
      };
      state.orders.push(order);
      grand += total;
      count++;
    });

    if (address !== m.address) m.address = address;
    state.bags[m.id] = [];
    /* 주문이 확정되면 바로 재고를 깎는다 */
    takeStock(need);
    save();

    ui.guestTab = 'orders';
    ui.detail = null;
    closeModal();
    openModal('orderDone', { count: count, total: grand, depositor: depositor });
    renderAll();
    scrollTop();
    toast('주문이 접수됐어요!');
  }

  function saveRound(data) {
    var d = ui.draft || {};
    var title = String(data.title || '').trim();
    if (!title) { toast('회차 이름을 적어 주세요'); return; }
    var dl = data.deadline ? new Date(data.deadline) : null;
    if (!dl || isNaN(dl.getTime())) { toast('마감 시간을 정해 주세요'); return; }
    var status = data.status === 'closed' ? 'closed' : 'open';
    if (d.mode === 'edit' && d.id) {
      var r = roundById(d.id);
      if (r) {
        r.title = title; r.deadline = dl.toISOString(); r.status = status;
        r.memo = String(data.memo || '').trim();
      }
      toast('회차를 수정했어요');
    } else {
      state.rounds.push({
        id: uid('rd'), title: title, memo: String(data.memo || '').trim(),
        deadline: dl.toISOString(), status: status, createdAt: nowStr()
      });
      toast('새 회차를 만들었어요');
    }
    save();
    closeModal();
    renderAll();
  }

  function saveProduct(data) {
    var d = ui.draft || {};
    var name = String(data.name || '').trim();
    var price = num(data.price);
    if (!name) { toast('상품명을 적어 주세요'); return; }
    if (price <= 0) { toast('판매가를 입력해 주세요'); return; }
    var roundId = data.roundId || d.roundId;
    if (!roundById(roundId)) { toast('바잉 회차를 골라 주세요'); return; }
    var options = String(data.options || '').split(',').map(function (x) { return x.trim(); }).filter(function (x) { return !!x; });
    var stockRaw = String(data.stock == null ? '' : data.stock).trim().replace(/[,\s]/g, '');
    if (stockRaw !== '' && !/^\d+$/.test(stockRaw)) { toast('재고는 0 이상의 숫자로 적어 주세요'); return; }
    var stockVal = stockRaw === '' ? null : num(stockRaw);
    var soldOutVal = !!data.soldOut;

    if (d.mode === 'edit' && d.id) {
      var p = productById(d.id);
      if (p) {
        p.name = name; p.desc = String(data.desc || '').trim(); p.price = price;
        p.costJpy = num(data.costJpy); p.options = options; p.badge = String(data.badge || '');
        p.roundId = roundId; p.image = d.image || sampleImage('');
        p.stock = stockVal; p.soldOut = soldOutVal;
      }
      toast('상품을 수정했어요');
    } else {
      state.products.push({
        id: uid('pd'), roundId: roundId, name: name, desc: String(data.desc || '').trim(),
        price: price, costJpy: num(data.costJpy), options: options,
        badge: String(data.badge || ''), image: d.image || sampleImage(''),
        stock: stockVal, soldOut: soldOutVal, createdAt: nowStr()
      });
      toast('상품을 등록했어요');
    }
    save();
    closeModal();
    renderAll();
  }

  function saveSettings(data) {
    state.settings.account = String(data.account || '').trim();
    state.settings.holder = String(data.holder || '').trim();
    state.settings.notice = String(data.notice || '').trim();
    save();
    renderAll();
    toast('설정을 저장했어요');
  }

  function submit(name, data, form) {
    if (name === 'login') doLogin(data);
    else if (name === 'signup') doSignup(data);
    else if (name === 'checkout') doCheckout(data);
    else if (name === 'round') saveRound(data);
    else if (name === 'product') saveProduct(data);
    else if (name === 'settings') saveSettings(data);
  }

  /* =========================================================
     사진 업로드 (리사이즈 후 dataURL 저장)
     ========================================================= */
  function handleFile(file) {
    if (!file) return;
    if (!/^image\//.test(file.type || '')) { toast('이미지 파일만 올릴 수 있어요'); return; }
    if (typeof FileReader === 'undefined') { toast('이 브라우저에서는 사진을 읽을 수 없어요'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var raw = reader.result;
      try {
        var img = new Image();
        img.onload = function () {
          try {
            var max = 720, w = img.width, h = img.height;
            if (w > max || h > max) {
              var ratio = Math.min(max / w, max / h);
              w = Math.round(w * ratio); h = Math.round(h * ratio);
            }
            var c = document.createElement('canvas');
            c.width = w; c.height = h;
            var ctx = c.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            if (!ui.draft) return;
            ui.draft.image = c.toDataURL('image/jpeg', 0.72);
            renderModal();
          } catch (e) {
            if (ui.draft) { ui.draft.image = raw; renderModal(); }
          }
        };
        img.onerror = function () { toast('사진을 읽지 못했어요. 다른 사진을 써주세요.'); };
        img.src = raw;
      } catch (e) {
        if (ui.draft) { ui.draft.image = raw; renderModal(); }
      }
    };
    reader.onerror = function () { toast('사진을 읽지 못했어요.'); };
    reader.readAsDataURL(file);
  }

  /* =========================================================
     이벤트
     ========================================================= */
  function onClick(e) {
    var t = e.target;
    var el = t && t.closest ? t.closest('[data-act]') : null;
    if (!el) return;
    if (el.tagName === 'A') e.preventDefault();
    action(el.getAttribute('data-act'), el.dataset || {}, el);
  }

  function onSubmit(e) {
    var f = e.target;
    if (!f || !f.getAttribute) return;
    var name = f.getAttribute('data-form');
    if (!name) return;
    e.preventDefault();
    var data = {};
    var els = f.querySelectorAll('input,select,textarea');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (!el.name) continue;
      if (el.type === 'checkbox') { if (el.checked) data[el.name] = el.value || 'on'; }
      else if (el.type === 'radio') { if (el.checked) data[el.name] = el.value; }
      else data[el.name] = el.value;
    }
    submit(name, data, f);
  }

  function onChange(e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var k = el.getAttribute('data-change');
    if (!k) return;
    if (k === 'productFile') {
      if (el.files && el.files[0]) handleFile(el.files[0]);
    } else if (k === 'expScope') {
      ui.expScope = el.value || 'all';
      render();
    } else if (k === 'expHeader') {
      ui.expHeader = !!el.checked;
      render();
    }
  }

  function onKey(e) {
    if (e.key === 'Escape' && ui.modal) closeModal();
  }

  function init() {
    state = load();
    ui.mode = 'guest';
    renderAll();
    document.addEventListener('click', onClick);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('change', onChange);
    document.addEventListener('keydown', onKey);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
