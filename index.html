<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4B3A">
<meta name="description" content="체리니 바잉 - 일본 현지 바잉 주문·입금·재고 관리 웹앱 (프로토타입)">
<meta name="app-version" content="2026-11-17-stock">
<title>체리니 바잉 · Cherinee Buying</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --cream:#FAF6EF;
  --cream2:#F2EADD;
  --card:#FFFFFF;
  --ink:#2A2620;
  --ink2:#4C453B;
  --muted:#8E8578;
  --line:#EDE4D6;
  --green:#1E4B3A;
  --green2:#2C6350;
  --green-soft:#E8F0EA;
  --rose:#B8726A;
  --rose-soft:#F9E9E5;
  --gold:#B8892B;
  --gold-soft:#FBF0D6;
  --shadow:0 2px 12px rgba(70,52,34,.06);
  --shadow-lg:0 18px 50px rgba(50,38,25,.24);
  --r:18px;
  --tabh:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color:var(--ink);font-size:15px;line-height:1.5;
  background:
    radial-gradient(1100px 520px at 8% -8%, #F8F1E5 0%, rgba(248,241,229,0) 62%),
    radial-gradient(900px 520px at 102% 2%, #EFE6D8 0%, rgba(239,230,216,0) 58%),
    #E8DFD1;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body.modal-open{overflow:hidden}
button{font-family:inherit}
h1,h2,h3,h4,p{margin:0}
img{max-width:100%}
a{color:var(--green2)}
::selection{background:#D8E7DC}

/* ============ app frame ============ */
.phone{
  position:relative;max-width:480px;min-height:100vh;min-height:100dvh;margin:0 auto;
  background:var(--cream);
  box-shadow:0 0 0 1px rgba(120,98,72,.08),0 26px 70px rgba(60,44,28,.20);
  display:flex;flex-direction:column;
}
@media (min-width:540px){
  .phone{margin:18px auto;min-height:calc(100dvh - 36px);border-radius:26px}
}

/* ============ preview bar ============ */
.previewbar{
  position:sticky;top:0;z-index:70;display:flex;align-items:center;gap:7px;
  padding:7px 9px;background:linear-gradient(180deg,#24382F,#1A2B24);color:#F4EEE3;
  box-shadow:0 3px 12px rgba(20,30,24,.28);
}
.pv-label{font-size:9px;letter-spacing:.14em;color:#BFB5A3;white-space:nowrap;padding-left:2px}
.pv-seg{display:flex;gap:2px;background:rgba(255,255,255,.09);padding:3px;border-radius:999px;flex:1;min-width:0}
.pv-seg button{
  flex:1;min-width:0;border:0;background:transparent;color:#D9D0C1;font:inherit;font-size:11px;font-weight:700;
  padding:6px 1px;border-radius:999px;cursor:pointer;white-space:nowrap;letter-spacing:-.02em;
}
.pv-seg button.active{background:#F7F1E6;color:#1E4B3A;box-shadow:0 1px 5px rgba(0,0,0,.18)}
.pv-reset{
  border:0;background:rgba(255,255,255,.09);color:#D9D0C1;width:29px;height:29px;border-radius:999px;
  font-size:14px;line-height:1;cursor:pointer;flex:none;
}
.pv-reset:active{background:rgba(255,255,255,.2)}

/* ============ layout ============ */
.screen{flex:1;padding:0 0 106px;min-height:60vh}
.view{padding:12px 16px 20px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 13px}
.brand{font-size:16px;font-weight:800;letter-spacing:.18em;color:var(--green);line-height:1.1}
.brand-sub{font-size:9.5px;letter-spacing:.3em;color:var(--muted);margin-top:3px;font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.sm{font-size:13px}
.center{text-align:center}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ============ hero ============ */
.hero{
  position:relative;border-radius:24px;padding:18px 18px 16px;color:#F7F2E7;overflow:hidden;
  background:radial-gradient(130% 130% at 88% 6%,#3C7C63 0%,#245641 48%,#17382C 100%);
  box-shadow:0 14px 30px rgba(30,75,58,.22);
}
.hero:after{
  content:'';position:absolute;width:230px;height:230px;right:-80px;bottom:-110px;border-radius:50%;
  background:rgba(255,255,255,.06);pointer-events:none;
}
.hero .tag{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.02em;
  background:rgba(255,255,255,.16);color:#E9F2EA;padding:4px 9px;border-radius:999px;
}
.hero h1{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:11px 0 5px;line-height:1.28}
.hero .cd{font-size:12.5px;color:#CFE0D4}
.hero .cd b{color:#F6DCA9;font-weight:800}
.hero .hstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:10.5px;color:#BFD3C5}
.hero .hstats span{background:rgba(0,0,0,.14);padding:4px 8px;border-radius:7px}

/* ============ notice ============ */
.notice{
  display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:11px 12px;
  background:#FFFDF8;border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--ink2);line-height:1.5;
}
.notice .ic{flex:none;font-size:13px;line-height:1.4}

/* ============ section ============ */
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 2px 10px}
.sechead h2{font-size:15px;font-weight:800;letter-spacing:-.02em;margin:0}
.sechead .cnt{font-size:11.5px;color:var(--muted);font-weight:600}

/* ============ chips ============ */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 5px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line);background:#fff;color:var(--ink2);font:inherit;font-size:12.5px;font-weight:700;
  padding:7px 12px;border-radius:999px;white-space:nowrap;cursor:pointer;flex:none;
}
.chip.active{background:var(--green);border-color:var(--green);color:#fff}
.chip .n{opacity:.65;font-weight:600;margin-left:3px;font-size:11px}

/* ============ product grid ============ */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
  cursor:pointer;display:flex;flex-direction:column;
}
.pcard:active{transform:scale(.995)}
.pimg{position:relative;aspect-ratio:1/1;background:var(--cream2);overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.badge{
  position:absolute;left:8px;top:8px;font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;
  background:#fff;color:var(--green);box-shadow:0 2px 7px rgba(0,0,0,.10);letter-spacing:-.01em;
}
.badge.hot{background:var(--rose);color:#fff}
.badge.limited{background:#1E4B3A;color:#fff}
.badge.new{background:#F6DCA9;color:#6B4A12}
.badge.best{background:#E9EDF7;color:#3C4A6B}
.badge.close{left:auto;right:8px;background:#4C453B;color:#fff}
.pbody{padding:10px 11px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.pbody h3{font-size:13px;font-weight:800;letter-spacing:-.02em;line-height:1.35;margin:0}
.pbody p{font-size:11px;color:var(--muted);line-height:1.45;min-height:31px;margin:0}
.prow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:7px}
.price{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.minibtn{
  border:0;background:var(--green-soft);color:var(--green);font:inherit;font-size:11.5px;font-weight:800;
  padding:6px 11px;border-radius:9px;cursor:pointer;flex:none;
}
.dim{opacity:.55}

/* ============ stock ============ */
.badge.out{left:auto;right:8px;background:#6E6558;color:#fff}
.stk{font-size:11px;font-weight:800;letter-spacing:-.01em;color:var(--green2)}
.stk.low{color:#B85C36}
.stk.out{color:#8E8578}
.stockline{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;
  padding:8px 11px;border-radius:11px;background:var(--green-soft);font-size:11.5px;font-weight:800;color:#1E4B3A;
}
.stockline .k{font-weight:700;opacity:.75}
.stockline.low{background:#FBEDE6;color:#A9582F}
.stockline.out{background:#F1ECE3;color:#7C7365}
.stkbar{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap}
.stkbar .lab{font-size:11px;font-weight:800;color:var(--muted);margin-right:2px}
.stkval{font-size:12px;font-weight:800;min-width:44px;text-align:center}
.stkval.low{color:#B85C36}
.stkval.out{color:#8E8578}
.stkbtn{
  border:1px solid var(--line);background:#fff;color:var(--ink2);font:inherit;font-size:11.5px;font-weight:800;
  padding:6px 10px;border-radius:9px;cursor:pointer;flex:none;
}
.stkbtn:active{background:var(--cream2)}
.stkbtn.on{background:var(--rose-soft);border-color:#EFCFC8;color:#A1584F}

/* ============ buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;
  background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:14px;padding:12px 16px;border-radius:13px;
  cursor:pointer;transition:transform .06s ease,background .15s ease;white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 6px 14px rgba(30,75,58,.16)}
.btn.rose{background:var(--rose);color:#fff}
.btn.ghost{border-color:var(--line);background:#fff;color:var(--ink2)}
.btn.line{border-color:rgba(30,75,58,.26);background:transparent;color:var(--green)}
.btn.sm{font-size:12.5px;padding:8px 12px;border-radius:10px;font-weight:800}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{
  width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
}

/* ============ pills / status ============ */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;letter-spacing:-.01em}
.st-unpaid{background:var(--rose-soft);color:#A1584F}
.st-claim{background:var(--gold-soft);color:#8A6614}
.st-paid{background:var(--green-soft);color:#1E4B3A}
.st-shipped{background:#E8ECF6;color:#3F5185}
.st-closed{background:#EFEAE1;color:#7C7365}

/* ============ cards / tiles ============ */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 12px}
.tile .k{font-size:11px;color:var(--muted);font-weight:700}
.tile .v{font-size:19px;font-weight:800;margin-top:2px;letter-spacing:-.03em}
.tile.alert{border-color:#EFCFC8;background:#FFF7F5}
.tile.alert .v{color:var(--rose)}
.tile.alert .k{color:#A1584F}

/* ============ order card ============ */
.ocard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow)}
.ocard + .ocard{margin-top:10px}
.ono{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.items{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:5px}
.items li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink2)}
.items li span{min-width:0}
.items li b{font-weight:700;white-space:nowrap}
.othumb{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--cream2);flex:none}
.acct-line{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0}
.acct-line .k{color:var(--muted);flex:none}
.acct-line .v{font-weight:700;text-align:right;word-break:break-all}

/* ============ stepper / cart ============ */
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:#fff;overflow:hidden;flex:none}
.stepper button{width:32px;height:31px;border:0;background:#fff;font-size:15px;color:var(--ink2);cursor:pointer;line-height:1}
.stepper button:active{background:var(--cream2)}
.stepper span{min-width:26px;text-align:center;font-weight:800;font-size:12.5px}
.qtyrow{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.sumbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:11px 13px;box-shadow:0 -2px 18px rgba(70,52,34,.10);
}
.bottomcta{
  position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));margin:0 auto;max-width:480px;
  padding:10px 16px;background:linear-gradient(180deg,rgba(250,246,239,0) 0%,var(--cream) 42%);z-index:55;
}
.accbox{background:#F2F7F2;border:1px dashed #C4D7C8;border-radius:14px;padding:12px 13px;font-size:12px;color:#2A4636;line-height:1.55}
.accbox b{font-size:13.5px;letter-spacing:.01em}
.accbox .tiny{color:#5C7A66}

/* ============ steps guide ============ */
.steps{display:flex;gap:6px;margin-top:10px}
.step{flex:1;background:#FFFDF8;border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-size:10.5px;color:var(--muted);text-align:center;line-height:1.35}
.step b{display:block;color:var(--green);font-size:11px;margin-bottom:1px;font-weight:800}

/* ============ forms ============ */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.field .hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;
  font:inherit;font-size:14.5px;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;
}
.field select{background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238E8578' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(44,99,80,.12)}
.field textarea{min-height:72px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink2);line-height:1.45;margin:2px 0 14px}
.check input{width:auto;margin:2px 0 0;flex:none;accent-color:var(--green)}
.err{background:#FDF0EE;border:1px solid #F2D3CE;color:#A1584F;border-radius:11px;padding:9px 11px;font-size:12px;margin-bottom:10px;line-height:1.45}
.okbox{background:#EFF6F1;border:1px solid #CFE1D4;color:#215B41;border-radius:11px;padding:9px 11px;font-size:12px;line-height:1.45}
.note{font-size:11px;color:var(--muted);line-height:1.5}

/* ============ export table ============ */
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:330px;-webkit-overflow-scrolling:touch}
table.exp{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}
table.exp th,table.exp td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left}
table.exp th{background:#FBF7F0;font-weight:800;color:var(--ink2);position:sticky;top:0;z-index:1;font-size:10.5px}
table.exp td.num{text-align:right;font-variant-numeric:tabular-nums}
table.exp tr:last-child td{border-bottom:0}

/* ============ image picker ============ */
.imgprev{width:100%;aspect-ratio:4/3;border-radius:14px;object-fit:cover;background:var(--cream2);border:1px solid var(--line);display:block}
.samplegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.samplegrid button{border:2px solid transparent;border-radius:12px;padding:0;overflow:hidden;background:#fff;cursor:pointer;aspect-ratio:1/1}
.samplegrid button.active{border-color:var(--green)}
.samplegrid img{width:100%;height:100%;object-fit:cover;display:block}
.filebtn{display:block;border:1px dashed #CFC4B3;border-radius:12px;padding:11px;text-align:center;font-size:12.5px;font-weight:700;color:var(--ink2);background:#fff;cursor:pointer}
.filebtn input{display:none}

/* ============ auth ============ */
.loginhero{text-align:center;padding:16px 0 6px}
.logo{
  width:62px;height:62px;border-radius:20px;margin:0 auto 12px;
  background:radial-gradient(120% 120% at 22% 10%,#3C7C63,#1E4B3A);color:#F7F1E6;
  display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.08em;font-size:19px;
  box-shadow:0 10px 22px rgba(30,75,58,.24);
}
.loginhero h1{font-size:21px;font-weight:800;letter-spacing:-.03em}
.loginhero p{margin-top:6px}
.authtabs{display:flex;background:#F0E8DB;border-radius:999px;padding:4px;margin:4px 0 16px}
.authtabs button{flex:1;border:0;background:transparent;font:inherit;font-size:13px;font-weight:800;color:#8B8172;padding:9px;border-radius:999px;cursor:pointer}
.authtabs button.active{background:#fff;color:var(--green);box-shadow:0 1px 5px rgba(0,0,0,.08)}
.demobox{margin-top:14px;background:#FFFDF8;border:1px dashed #DED3C1;border-radius:14px;padding:11px 12px;font-size:11.5px;color:var(--ink2);line-height:1.5}
.demobox b{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.demobox button{
  display:inline-block;margin:2px 4px 2px 0;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:5px 8px;font:inherit;font-size:11px;font-weight:700;color:var(--green);cursor:pointer;
}
.pendingbadge{display:inline-flex;align-items:center;justify-content:center;width:74px;height:74px;border-radius:50%;background:var(--gold-soft);font-size:30px;margin-bottom:6px}

/* ============ modal ============ */
.modalwrap{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center}
.modalback{position:absolute;inset:0;background:rgba(26,32,28,.46);animation:fade .2s ease;border:0}
.sheet{
  position:relative;width:100%;max-width:480px;background:var(--cream);border-radius:22px 22px 0 0;
  max-height:92dvh;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.85,.25,1);
  box-shadow:var(--shadow-lg);
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 11px;border-bottom:1px solid var(--line);flex:none}
.sheet-head h2{font-size:15px;font-weight:800;letter-spacing:-.02em;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{padding:14px 16px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.sheet-foot{padding:11px 16px calc(13px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;background:#FFFDF9;flex:none}
.sheet-foot .btn{flex:1}
.xbtn{
  width:31px;height:31px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);
  font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;line-height:1;
}
@keyframes up{from{transform:translateY(34px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ============ tabbar ============ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;z-index:60;
  display:flex;background:rgba(255,253,249,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);

  /* 상품 카드·목록처럼 좁은 곳에 쓰는 재고 문구 */
  function cardStockHtml(p) {
    var st = stockState(p);
    if (st === 'out') return '<div class="stk out">품절</div>';
    var s = stockLeft(p);
    if (s === null) return '';
    return '<div class="stk' + (st === 'low' ? ' low' : '') + '">남은 ' + s + '개' + (st === 'low' ? ' · 서둘러 주세요' : '') + '</div>';
  }
  /* 장바구니·주문서처럼 자세한 곳에 쓰는 재고 안내 */
  function stockLineHtml(p) {
    var st = stockState(p);
    var s = stockLeft(p);
    var k = st === 'out' ? '재고' : '남은 수량';
    var v = st === 'out' ? '품절' : (s === null ? '수량 제한 없음' : s + '개 남음');
    var extra = (st === 'out' || s === null) ? '' : (st === 'low' ? ' · 마감 임박' : '');
    return '<div class="stockline ' + (st === 'out' ? 'out' : st === 'low' ? 'low' : '') + '">' +
      '<span class="k">' + k + '</span><span>' + v + extra + '</span></div>';
  }
  /* 장바구니 한 줄에 붙는 재고 힌트 */
  function cartStockHint(p, qty) {
    var s = stockLeft(p);
    if (isSoldOut(p)) return ' · <span style="color:var(--rose);font-weight:800">품절</span>';
    if (s === null) return '';
    if (num(qty) > s) return ' · <span style="color:var(--rose);font-weight:800">재고 부족 (남은 ' + s + '개)</span>';
    return ' · <span style="color:' + (s <= 3 ? 'var(--rose)' : 'var(--muted)') + ';font-weight:' + (s <= 3 ? '800' : '400') + '">남은 ' + s + '개</span>';
  }
  /* 장바구니 전체가 재고 안에서 주문 가능한지 — 문제가 있으면 안내 문구, 없으면 null */
  function bagProblem() {
    var need = bagNeed();
    var msg = null;
    Object.keys(need).forEach(function (pid) {
      if (msg) return;
      var p = productById(pid);
      if (!p) return;
      if (isSoldOut(p)) { msg = p.name + ' · 품절'; return; }
      var s = stockLeft(p);
      if (s !== null && need[pid] > s) msg = p.name + ' · 남은 ' + s + '개';
    });
    return msg;
  }
  /* 상품별로 장바구니 수량을 합친 값 (옵션이 달라도 같은 상품은 합산) */
  function bagNeed() {
    var need = {};
    bag().forEach(function (it) {
      if (!productById(it.pid)) return;
      need[it.pid] = (need[it.pid] || 0) + num(it.qty);
    });
    return need;
  }
  /* 주문에 담긴 수량만큼 재고를 다시 더해 준다 (주문 삭제 시) */
  function restoreStock(order) {
    var restored = 0;
    ((order && order.items) || []).forEach(function (it) {
      var p = productById(it.productId);
      if (!p) return;
      var s = stockLeft(p);
      if (s === null) return;
      p.stock = s + num(it.qty);
      restored += num(it.qty);
    });
    return restored;
  }
  /* 주문 확정 시 재고 차감 */
  function takeStock(need) {
    Object.keys(need).forEach(function (pid) {
      var p = productById(pid);
      var s = stockLeft(p);
      if (s === null) return;
      p.stock = Math.max(0, s - num(need[pid]));
    });
  }
  function currentMember() {
    var s = state.session;
    if (!s || s.role !== 'member') return null;
    var m = memberById(s.memberId);
    if (!m || m.status !== 'approved') return null;
    return m;
  }
  function roundsSorted() {
    return state.rounds.slice().sort(function (a, b) { return dparse(b.createdAt) - dparse(a.createdAt); });
  }
  function roundState(r) {
    if (!r) return { closed: true, expired: true, label: '마감' };
    var expired = dparse(r.deadline).getTime() <= Date.now();
    var closed = r.status !== 'open' || expired;
    return { closed: closed, expired: expired, label: closed ? '마감' : '진행중' };
  }
  function openRounds() {
    return roundsSorted().filter(function (r) { return !roundState(r).closed; });
  }
  function countdown(iso) {
    var left = dparse(iso).getTime() - Date.now();
    if (left <= 0) return { over: true, text: '마감됐어요' };
    var d = Math.floor(left / 86400000);
    var h = Math.floor((left % 86400000) / 3600000);
    var m = Math.floor((left % 3600000) / 60000);
    return { over: false, d: d, h: h, m: m, text: (d > 0 ? 'D-' + d + ' · ' : '') + h + '시간 ' + m + '분 남음' };
  }
  function bagOf(m) {
    if (!m) return [];
    if (!state.bags[m.id]) state.bags[m.id] = [];
    return state.bags[m.id];
  }
  function bag() { return bagOf(currentMember()); }
  function bagCount() {
    return bag().reduce(function (s, it) { return s + num(it.qty); }, 0);
  }
  function bagTotal() {
    return bag().reduce(function (s, it) {
      var p = productById(it.pid);
      return s + (p ? num(p.price) * num(it.qty) : 0);
    }, 0);
  }
  function maskPccc(p) {
    if (!p) return '—';
    if (p.length <= 6) return p;
    return p.slice(0, 3) + '********' + p.slice(-2);
  }
  function nextOrderNo() {
    var d = new Date();
    var pre = 'C' + String(d.getFullYear()).slice(2) + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-';
    var n = 0;
    state.orders.forEach(function (o) { if (String(o.no).indexOf(pre) === 0) n++; });
    return pre + pad2(n + 1);
  }
  function addLog(order, status) {
    order.status = status;
    if (!order.logs) order.logs = [];
    order.logs.push({ status: status, at: nowStr() });
  }

  /* ---------- shell / render ---------- */
  var ICONS = {
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/>',
    bag: '<path d="M6 8h12l1.2 12.2H4.8L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h4"/>',
    user: '<circle cx="12" cy="8" r="3.6"/><path d="M4.5 21c1.4-3.7 4.2-5.4 7.5-5.4s6.1 1.7 7.5 5.4"/>',
    box: '<path d="M12 3 21 7.5v9L12 21 3 16.5v-9L12 3Z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
    users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c1.2-3.3 3.6-4.9 6-4.9s4.8 1.6 6 4.9"/><path d="M16 5.6a3 3 0 0 1 0 5.6M18.6 20c-.3-2.2-1.2-3.8-2.4-4.7"/>',
    download: '<path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 20h16"/>'
  };
  function icon(k) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[k] || '') + '</svg>'; }

  function render() {
    var html;
    if (ui.mode === 'admin') html = viewAdmin();
    else if (ui.mode === 'auth') html = viewAuth();
    else html = viewGuest();
    var el = document.getElementById('screen');
    if (el) el.innerHTML = html;
    renderTabs();
    renderBar();
  }
  function renderAll() { render(); renderModal(); }
  function renderBar() {
    var btns = document.querySelectorAll('[data-act="mode"]');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute('data-mode') === ui.mode;
      btns[i].classList.toggle('active', on);
    }
  }
  function renderTabs() {
    var el = document.getElementById('tabbar');
    if (!el) return;
    if (ui.mode === 'auth') { el.innerHTML = ''; el.style.display = 'none'; return; }
    el.style.display = 'flex';
    var items, cur;
    if (ui.mode === 'admin') {
      cur = ui.adminTab;
      var pend = state.members.filter(function (m) { return m.status === 'pending'; }).length;
      items = [
        { k: 'orders', icon: 'receipt', label: '주문 관리' },
        { k: 'products', icon: 'box', label: '상품·회차' },
        { k: 'members', icon: 'users', label: '회원', badge: pend },
        { k: 'export', icon: 'download', label: '시트 내보내기' }
      ];
    } else {
      cur = ui.guestTab;
      items = [
        { k: 'home', icon: 'home', label: '홈' },
        { k: 'cart', icon: 'bag', label: '장바구니', badge: bagCount() },
        { k: 'orders', icon: 'receipt', label: '주문내역' },
        { k: 'me', icon: 'user', label: '내 정보' }
      ];
    }
    el.innerHTML = items.map(function (it) {
      return '<button type="button" data-act="tab" data-tab="' + it.k + '" class="' + (cur === it.k ? 'active' : '') + '" aria-label="' + it.label + '">' +
        icon(it.icon) + '<span>' + it.label + '</span>' +
        (it.badge ? '<span class="dot">' + it.badge + '</span>' : '') + '</button>';
    }).join('');
  }
  function openModal(name, data) {
    ui.modal = { name: name, data: data || null };
    renderModal();
    try { document.body.classList.add('modal-open'); } catch (e) {}
  }
  function closeModal() {
    ui.modal = null;
    ui.detail = null;
    renderModal();
    try { document.body.classList.remove('modal-open'); } catch (e) {}
  }
  function renderModal() {
    var root = document.getElementById('modalRoot');
    if (!root) return;
    if (!ui.modal) { root.innerHTML = ''; return; }
    root.innerHTML = modalHtml();
  }
  function sheet(title, body, foot) {
    return '<div class="modalwrap"><button type="button" class="modalback" data-act="closeModal" aria-label="닫기"></button>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="sheet-head"><h2>' + esc(title) + '</h2><button type="button" class="xbtn" data-act="closeModal" aria-label="닫기">✕</button></div>' +
      '<div class="sheet-body">' + body + '</div>' +
      (foot ? '<div class="sheet-foot">' + foot + '</div>' : '') +
      '</div></div>';
  }
  function formSheet(title, formName, body, foot) {
    return '<div class="modalwrap"><button type="button" class="modalback" data-act="closeModal" aria-label="닫기"></button>' +
      '<form class="sheet" data-form="' + formName + '" aria-label="' + esc(title) + '">' +
      '<div class="sheet-head"><h2>' + esc(title) + '</h2><button type="button" class="xbtn" data-act="closeModal" aria-label="닫기">✕</button></div>' +
      '<div class="sheet-body">' + body + '</div>' +
      '<div class="sheet-foot">' + foot + '</div></form></div>';
  }

  /* =========================================================
     손님 화면
     ========================================================= */
  function viewGuest() {
    var m = currentMember();
    var body;
    if (ui.guestTab === 'cart') body = guestCart(m);
    else if (ui.guestTab === 'orders') body = guestOrders(m);
    else if (ui.guestTab === 'me') body = guestMe(m);
    else body = guestHome(m);
    return '<div class="view">' + body + '</div>';
  }

  function brandHeader(title, sub) {
    return '<div class="brandbar"><div><div class="brand">' + esc(title) + '</div>' +
      (sub ? '<div class="brand-sub">' + esc(sub) + '</div>' : '') + '</div></div>';
  }

  function emptyBox(emoji, title, msg, action) {
    return '<div class="empty"><div class="big">' + emoji + '</div><b>' + esc(title) + '</b>' +
      '<div>' + msg + '</div>' + (action ? '<div class="mt12">' + action + '</div>' : '') + '</div>';
  }

  function gateCard(msg) {
    return '<div class="card gate"><div class="ico">🔐</div>' +
      '<p class="sm" style="color:var(--ink2);line-height:1.55">' + msg + '</p>' +
      '<div class="row" style="justify-content:center;gap:8px;margin-top:14px">' +
      '<button type="button" class="btn primary sm" data-act="goAuth" data-tab="login">로그인</button>' +
      '<button type="button" class="btn ghost sm" data-act="goAuth" data-tab="signup">가입 신청</button>' +
      '</div></div>';
  }

  function guestHome(m) {
    var rounds = roundsSorted();
    var sel = null;
    if (ui.homeRoundId) sel = roundById(ui.homeRoundId);
    if (!sel) {
      var open = rounds.filter(function (r) { return !roundState(r).closed; });
      sel = open[0] || rounds[0];
    }
    var h = '';
    h += '<div class="brandbar">' +
      '<div><div class="brand">CHERINEE</div><div class="brand-sub">체리니 바잉</div></div>' +
      (m
        ? '<span class="pill st-paid">' + esc(m.name) + '님</span>'
        : '<button type="button" class="btn sm line" data-act="goAuth" data-tab="login">로그인</button>') +
      '</div>';

    if (!sel) {
      h += '<div class="card gate"><div class="ico">🍒</div><b>진행 중인 바잉이 없어요</b>' +
        '<p class="tiny muted mt8">사장님이 새 바잉 회차를 열면 여기에 상품이 보여요.</p></div>';
      return h;
    }

    var rs = roundState(sel);
    var cd = countdown(sel.deadline);
    var prods = state.products.filter(function (p) { return p.roundId === sel.id; });

    h += '<section class="hero">' +
      '<span class="tag">' + (rs.closed ? '마감된 회차' : '진행중 · ' + prods.length + '개 상품') + '</span>' +
      '<h1>' + esc(sel.title) + '</h1>' +
      '<div class="cd">' + (rs.closed ? '이번 회차 주문이 마감됐어요' : '마감까지 <b>' + cd.text + '</b>') + '</div>' +
      '<div class="hstats"><span>마감 ' + esc(fmtDL(sel.deadline)) + '</span>' +
      '<span>' + esc(sel.memo || '현지 픽업 후 순차 발송') + '</span></div>' +
      '</section>';

    if (!m) {
      h += '<div class="card mt12">' +
        '<div class="between"><b class="sm">처음 오셨나요?</b>' +
        '<button type="button" class="btn sm line" data-act="goAuth" data-tab="signup">가입 신청</button></div>' +
        '<p class="tiny muted mt8">승인된 회원만 주문할 수 있어요. 아래 순서로 진행돼요.</p>' +
        '<div class="steps"><div class="step"><b>1</b>가입 신청</div><div class="step"><b>2</b>사장님 승인</div><div class="step"><b>3</b>바잉 주문</div></div>' +
        '</div>';
    }

    if (state.settings.notice) {
      h += '<div class="notice"><span class="ic" aria-hidden="true">📢</span><p>' + esc(state.settings.notice) + '</p></div>';
    }

    if (rounds.length > 1) {
      h += '<div class="chips mt16">' + rounds.map(function (r) {
        var st = roundState(r);
        return '<button type="button" class="chip ' + (r.id === sel.id ? 'active' : '') + '" data-act="homeRound" data-id="' + r.id + '">' +
          esc(r.title) + (st.closed ? ' · 마감' : '') + '</button>';
      }).join('') + '</div>';
    }

    h += '<div class="sechead"><h2>이번 바잉 상품</h2><span class="cnt">' + prods.length + '개</span></div>';
    if (!prods.length) {
      h += '<div class="card">' + emptyBox('📦', '등록된 상품이 없어요', '사장님이 상품을 올리면 바로 보여요.') + '</div>';
    } else {
      h += '<div class="pgrid">' + prods.map(function (p) { return productCard(p, rs.closed); }).join('') + '</div>';
    }
    h += '<p class="tiny muted center mt20" style="line-height:1.6">사진은 실제 상품과 다를 수 있어요.<br>주문서 제출 → 입금 → 입금 확인 순서로 진행돼요.</p>';
    return h;
  }

  function productCard(p, closed) {
    var b = badgeInfo(p.badge);
    var out = isSoldOut(p);
    return '<article class="pcard' + (closed || out ? ' dim' : '') + '" data-act="openProduct" data-id="' + p.id + '">' +
      '<div class="pimg"><img src="' + p.image + '" alt="' + esc(p.name) + '" loading="lazy">' +
      (b.label ? '<span class="badge ' + b.cls + '">' + esc(b.label) + '</span>' : '') +
      (out ? '<span class="badge out">품절</span>' : (closed ? '<span class="badge close">마감</span>' : '')) + '</div>' +
      '<div class="pbody"><h3>' + esc(p.name) + '</h3><p>' + esc(p.desc || '') + '</p>' +
      cardStockHtml(p) +
      '<div class="prow"><strong class="price">' + won(p.price) + '</strong>' +
      (closed ? '<span class="tiny muted">주문 마감</span>'
        : out ? '<span class="tiny muted">품절</span>'
          : '<button type="button" class="minibtn" data-act="openProduct" data-id="' + p.id + '">담기</button>') +
      '</div></div></article>';
  }

  function guestCart(m) {
    var h = brandHeader('장바구니', '담아둔 상품을 확인해 주세요');
    if (!m) return h + gateCard('로그인하면 장바구니를 쓸 수 있어요.<br>승인된 회원만 주문할 수 있습니다.');

    var items = bag();
    var rows = '';
    var valid = 0;
    items.forEach(function (it, i) {
      var p = productById(it.pid);
      if (!p) return;
      valid++;
      var rs = roundState(roundById(p.roundId));
      rows += '<div class="ocard mt10">' +
        '<div class="row"><img class="othumb" src="' + p.image + '" alt="">' +
        '<div style="flex:1;min-width:0">' +
        '<div class="sm" style="font-weight:800">' + esc(p.name) + '</div>' +
        '<div class="tiny muted">' + (it.opt ? '옵션 · ' + esc(it.opt) : '기본') + (rs.closed ? ' · <span style="color:var(--rose)">마감</span>' : '') + cartStockHint(p, it.qty) + '</div>' +
        '</div>' +
        '<button type="button" class="xbtn" data-act="cartDel" data-i="' + i + '" aria-label="삭제">✕</button></div>' +
        '<div class="between" style="margin-top:10px">' +
        '<div class="stepper"><button type="button" data-act="cartQty" data-i="' + i + '" data-delta="-1" aria-label="수량 줄이기">−</button>' +
        '<span>' + it.qty + '</span>' +
        '<button type="button" data-act="cartQty" data-i="' + i + '" data-delta="1" aria-label="수량 늘리기">+</button></div>' +
        '<strong>' + won(num(p.price) * num(it.qty)) + '</strong></div></div>';
    });

    if (!valid) {
      return h + emptyBox('🛍️', '장바구니가 비어 있어요', '마음에 드는 상품을 담아보세요.',
        '<button type="button" class="btn sm line" data-act="goHome">상품 보러가기</button>');
    }

    var total = bagTotal();
    var cnt = bagCount();
    var bad = bagProblem();
    return h + rows +
      (bad ? '<div class="notice mt12"><span class="ic" aria-hidden="true">⚠\ufe0f</span><p><b>' + esc(bad) +
        '</b> 때문에 지금은 주문할 수 없어요.<br>수량을 줄이거나 장바구니에서 빼 주세요.</p></div>' : '') +
      '<div style="height:96px"></div>' +
      '<div class="bottomcta"><div class="sumbar">' +
      '<div><div class="tiny muted">총 ' + cnt + '개</div>' +
      '<strong style="font-size:17px;letter-spacing:-.02em">' + won(total) + '</strong></div>' +
      '<button type="button" class="btn primary" data-act="openCheckout">주문서 작성</button></div></div>';
  }

  function guestOrders(m) {
    var h = brandHeader('주문내역', '입금 확인까지 한눈에');
    if (!m) return h + gateCard('로그인하면 주문 내역을 볼 수 있어요.');

    var list = state.orders.filter(function (o) { return o.memberId === m.id; })
      .sort(function (a, b) { return dparse(b.createdAt) - dparse(a.createdAt); });
    if (!list.length) {
      return h + emptyBox('🧾', '아직 주문이 없어요', '이번 바잉 상품을 둘러보고 주문해 보세요.',
        '<button type="button" class="btn sm line" data-act="goHome">상품 보러가기</button>');
    }
    var head = '<div class="tiles mt8">' +
      '<div class="tile"><div class="k">전체 주문</div><div class="v">' + list.length + '건</div></div>' +
      '<div class="tile"><div class="k">입금 완료</div><div class="v">' + list.filter(function (o) { return o.status === 'paid' || o.status === 'shipped'; }).length + '건</div></div>' +
      '</div>';
    return h + head + '<div class="sechead"><h2>주문 목록</h2><span class="cnt">최신순</span></div>' +
      list.map(function (o) { return myOrderCard(o, m); }).join('');
  }

  function myOrderCard(o, m) {
    var r = roundById(o.roundId);
    var body = '<div class="between"><span class="ono">' + esc(o.no) + '</span>' +
      '<span class="pill ' + STCLS[o.status] + '">' + ST[o.status] + '</span></div>' +
      '<div class="tiny muted" style="margin-top:2px">' + esc(r ? r.title : '') + ' · ' + fmtDT(o.createdAt) + '</div>' +
      '<ul class="items">' + o.items.map(function (it) {
        return '<li><span>' + esc(it.name) + (it.option ? ' · ' + esc(it.option) : '') + ' × ' + it.qty + '</span>' +
          '<b>' + won(it.price * it.qty) + '</b></li>';
      }).join('') + '</ul>' +
      '<div class="between" style="margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)">' +
      '<span class="tiny muted">합계</span><strong>' + won(o.total) + '</strong></div>';

    if (o.status === 'unpaid') {
      body += '<div class="accbox mt10"><div class="tiny">입금 계좌</div>' +
        '<b>' + esc(state.settings.account) + '</b>' +
        '<div class="tiny">예금주 ' + esc(state.settings.holder) + ' · 입금자명 <b>' + esc(o.depositor || m.name) + '</b></div>' +
        '<button type="button" class="btn sm ghost mt8" data-act="copyAccount">계좌 복사</button></div>' +
        '<button type="button" class="btn primary block mt10" data-act="claim" data-id="' + o.id + '">입금 확인 요청</button>' +
        '<p class="tiny muted mt8">입금 후 버튼을 눌러 주세요. 사장님이 확인하면 ‘입금 완료’로 바뀌어요.</p>';
    } else if (o.status === 'claim') {
      body += '<div class="okbox mt10">입금 확인을 요청했어요. 사장님이 확인하면 ‘입금 완료’로 바뀌어요.</div>';

      body += '<div class="okbox mt10">배송이 시작됐어요. 곧 받아보실 수 있어요!</div>';

    h += '<div class="card">' +
      '<div class="row" style="gap:12px">' +
      '<div class="logo" style="width:52px;height:52px;border-radius:16px;font-size:15px;margin:0">' + esc(String(m.name).slice(0, 1)) + '</div>' +
      '<div style="min-width:0"><div style="font-weight:800;font-size:16px">' + esc(m.name) + '</div>' +
      '<div class="tiny muted">' + esc(m.nickname || '인스타 ID 없음') + ' · 승인된 회원</div></div></div>' +
      '<div class="divider"></div>' +
      '<div class="acct-line"><span class="k">연락처</span><span class="v">' + esc(m.phone) + '</span></div>' +
      '<div class="acct-line"><span class="k">배송지</span><span class="v">' + esc(m.address) + '</span></div>' +
      '<div class="acct-line"><span class="k">개인통관고유부호</span><span class="v">' +
      esc(ui.pcccShow ? m.pccc : maskPccc(m.pccc)) +
      ' <button type="button" class="tiny" style="border:0;background:none;color:var(--green2);font-weight:800;cursor:pointer" data-act="pccc">' +
      (ui.pcccShow ? '숨기기' : '보기') + '</button></span></div>' +
      '</div>';

    h += '<div class="card mt12"><div class="between"><b class="sm">입금 계좌</b>' +
      '<button type="button" class="btn sm ghost" data-act="copyAccount">복사</button></div>' +
      '<div class="accbox mt8"><b>' + esc(state.settings.account) + '</b>' +
      '<div class="tiny">예금주 ' + esc(state.settings.holder) + '</div></div></div>';

    h += '<div class="card mt12"><div class="acct-line"><span class="k">주문 내역</span><span class="v">' +
      state.orders.filter(function (o) { return o.memberId === m.id; }).length + '건</span></div>' +
      '<div class="acct-line"><span class="k">가입일</span><span class="v">' + fmtDate(m.requestedAt) + '</span></div>' +
      '<p class="note mt8">정보를 바꾸고 싶으시면 사장님께 카카오톡으로 말씀해 주세요.</p></div>';

    h += '<button type="button" class="btn ghost block mt16" data-act="logout">로그아웃</button>';
    h += '<p class="tiny muted center mt16">체리니 바잉 · 승인제 주문 스토어</p>';

  /* =========================================================
     사장님 화면
     ========================================================= */
  function viewAdmin() {
    var t = ui.adminTab;
    var body;
    if (t === 'products') body = adminProducts();
    else if (t === 'members') body = adminMembers();
    else if (t === 'export') body = adminExport();
    else body = adminOrders();
    return '<div class="view">' + adminHeader() + body + '</div>';
  }

  function adminHeader() {
    return '<div class="brandbar">' +
      '<div><div class="brand" style="font-size:14px">CHERINEE</div><div class="brand-sub">사장님 관리</div></div>' +
      '<span class="pill st-paid">사장님 모드</span></div>' +
      '<p class="tiny muted" style="margin:-6px 2px 12px">미리보기용 관리자 화면이에요. 손님 화면과 같은 데이터를 씁니다.</p>';
  }

  function adminOrders() {
    var orders = state.orders.slice().sort(function (a, b) { return dparse(b.createdAt) - dparse(a.createdAt); });
    var claim = orders.filter(function (o) { return o.status === 'claim'; });
    var unpaid = orders.filter(function (o) { return o.status === 'unpaid'; });
    var paid = orders.filter(function (o) { return o.status === 'paid'; });
    var shipped = orders.filter(function (o) { return o.status === 'shipped'; });
    var today = orders.filter(function (o) { return fmtDate(o.createdAt) === todayStr(); });
    var paidSum = orders.filter(function (o) { return o.status === 'paid' || o.status === 'shipped'; })
      .reduce(function (s, o) { return s + num(o.total); }, 0);

    var h = '<div class="tiles">' +
      '<div class="tile"><div class="k">오늘 주문</div><div class="v">' + today.length + '건</div></div>' +
      '<div class="tile ' + (claim.length ? 'alert' : '') + '"><div class="k">입금 확인 대기</div><div class="v">' + claim.length + '건</div></div>' +
      '<div class="tile"><div class="k">미입금</div><div class="v">' + unpaid.length + '건</div></div>' +
      '<div class="tile"><div class="k">입금 완료 합계</div><div class="v" style="font-size:16px">' + won(paidSum) + '</div></div>' +
      '</div>';

    var filters = [
      { k: 'all', label: '전체', n: orders.length },
      { k: 'unpaid', label: '미입금', n: unpaid.length },
      { k: 'claim', label: '입금 확인 대기', n: claim.length },
      { k: 'paid', label: '입금 완료', n: paid.length },
      { k: 'shipped', label: '배송중', n: shipped.length },
      { k: 'byMember', label: '손님별 모아보기', n: 0 }
    ];
    h += '<div class="chips mt16">' + filters.map(function (f) {
      return '<button type="button" class="chip ' + (ui.orderFilter === f.k ? 'active' : '') + '" data-act="filter" data-filter="' + f.k + '">' +
        f.label + (f.n ? '<span class="n">' + f.n + '</span>' : '') + '</button>';
    }).join('') + '</div>';

    if (ui.orderFilter === 'byMember') {
      h += '<div class="mt12">' + adminByMember(orders) + '</div>';
      return h;
    }

    var list = orders;
    if (ui.orderFilter !== 'all') list = orders.filter(function (o) { return o.status === ui.orderFilter; });

    h += '<div class="sechead"><h2>' + (ui.orderFilter === 'all' ? '전체 주문' : filters.filter(function (f) { return f.k === ui.orderFilter; })[0].label) + '</h2>' +
      '<span class="cnt">' + list.length + '건</span></div>';
    if (!list.length) {
      h += '<div class="card">' + emptyBox('📭', '해당 주문이 없어요', '손님이 주문하면 이곳에 표시돼요.') + '</div>';
    } else {
      h += list.map(adminOrderCard).join('');
    }
    return h;
  }

  function adminOrderCard(o) {
    var m = memberById(o.memberId);
    var r = roundById(o.roundId);
    var h = '<div class="ocard">' +
      '<div class="between"><span class="ono">' + esc(o.no) + ' · ' + fmtDT(o.createdAt) + '</span>' +
      '<span class="pill ' + STCLS[o.status] + '">' + ST[o.status] + '</span></div>' +
      '<div class="mt8"><div class="sm" style="font-weight:800">' + esc(m ? m.name : '알 수 없음') +
      (m && m.nickname ? ' <span class="tiny muted" style="font-weight:600">' + esc(m.nickname) + '</span>' : '') + '</div>' +
      '<div class="tiny muted">' + esc(m ? m.phone : '') + ' · ' + esc(r ? r.title : '') + '</div></div>' +
      '<ul class="items">' + o.items.map(function (it) {
        return '<li><span>' + esc(it.name) + (it.option ? ' · ' + esc(it.option) : '') + ' × ' + it.qty + '</span>' +
          '<b>' + won(it.price * it.qty) + '</b></li>';
      }).join('') + '</ul>' +
      '<div class="between" style="margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)">' +
      '<span class="tiny muted">입금자명 ' + esc(o.depositor || '-') + '</span>' +
      '<strong>' + won(o.total) + '</strong></div>';

    if (o.address) h += '<div class="tiny muted mt8">배송지 · ' + esc(o.address) + '</div>';
    if (o.memo) h += '<div class="tiny muted mt8">요청 · ' + esc(o.memo) + '</div>';

    h += '<div class="row" style="gap:6px;margin-top:11px;flex-wrap:wrap">';
    if (o.status === 'unpaid' || o.status === 'claim') {
      h += '<button type="button" class="btn sm primary" data-act="deposit" data-id="' + o.id + '">입금 확인</button>';
    }
    if (o.status === 'paid') {
      h += '<button type="button" class="btn sm ghost" data-act="ship" data-id="' + o.id + '">배송 시작</button>';
    }
    if (o.status === 'shipped') {
      h += '<span class="pill st-shipped">배송중</span>';
    }
    h += '<button type="button" class="btn sm ghost" data-act="delOrder" data-id="' + o.id + '">삭제</button>';
    h += '</div></div>';
    return h;
  }

  function adminByMember(orders) {
    var groups = {};
    var order = [];
    orders.forEach(function (o) {
      if (!groups[o.memberId]) { groups[o.memberId] = []; order.push(o.memberId); }
      groups[o.memberId].push(o);
    });
    if (!order.length) return '<div class="card">' + emptyBox('👥', '주문이 아직 없어요', '손님별 주문이 이곳에 모여 보여요.') + '</div>';

    return order.map(function (id) {
      var m = memberById(id);
      var list = groups[id];
      var sum = list.reduce(function (s, o) { return s + num(o.total); }, 0);
      var need = list.filter(function (o) { return o.status === 'unpaid' || o.status === 'claim'; });
      var h = '<div class="ocard">' +
        '<div class="between"><div><b>' + esc(m ? m.name : '알 수 없음') + '</b>' +
        (m && m.nickname ? ' <span class="tiny muted">' + esc(m.nickname) + '</span>' : '') + '</div>' +
        '<span class="pill st-paid">' + list.length + '건 · ' + won(sum) + '</span></div>' +
        '<div class="tiny muted" style="margin-top:2px">' + esc(m ? m.phone : '') + '</div>' +
        '<ul class="items">' + list.map(function (o) {
          return '<li><span>' + esc(o.no) + ' · ' + ST[o.status] + '</span><b>' + won(o.total) + '</b></li>';
        }).join('') + '</ul>';
      if (need.length) {
        h += '<button type="button" class="btn sm primary mt8" data-act="depositMember" data-id="' + id + '">미입금 ' + need.length + '건 입금 확인</button>';
      }
      return h + '</div>';
    }).join('');
  }

  /* ---------- 회차 & 상품 ---------- */
  function adminProducts() {
    var rounds = roundsSorted();
    var sel = ui.adminRoundId ? roundById(ui.adminRoundId) : rounds[0];
    var h = '<div class="sechead" style="margin-top:4px"><h2>바잉 회차</h2>' +
      '<button type="button" class="btn sm primary" data-act="newRound">+ 새 회차</button></div>';
    if (!rounds.length) {
      h += '<div class="card">' + emptyBox('📅', '회차가 없어요', '새 회차를 만들어 상품을 등록해 보세요.') + '</div>';
    } else {
      h += rounds.map(roundCard).join('');
    }

    h += '<div class="sechead"><h2>상품 등록</h2>' +
      '<button type="button" class="btn sm primary" data-act="newProduct"' + (rounds.length ? '' : ' disabled') + '>+ 상품</button></div>';
    if (!rounds.length) {
      h += '<div class="card"><p class="tiny muted">회차를 먼저 만들어 주세요.</p></div>';
      return h;
    }
    h += '<div class="chips">' + rounds.map(function (r) {
      return '<button type="button" class="chip ' + (sel && sel.id === r.id ? 'active' : '') + '" data-act="adminRound" data-id="' + r.id + '">' + esc(r.title) + '</button>';
    }).join('') + '</div>';

    var list = sel ? state.products.filter(function (p) { return p.roundId === sel.id; }) : [];
    h += '<p class="note mt8">재고는 상품마다 − · + · +5 버튼으로 현장에서 바로 늘리고 줄일 수 있어요. 수량을 비워 둔 상품은 ‘무제한’으로 팔려요.</p>';
    h += '<div class="mt10">' + (list.length
      ? list.map(productRow).join('')
      : '<div class="card">' + emptyBox('📦', '등록된 상품이 없어요', '이 회차에 상품을 등록해 보세요.') + '</div>') + '</div>';
    return h;
  }

  function roundCard(r) {
    var rs = roundState(r);
    var pc = state.products.filter(function (p) { return p.roundId === r.id; }).length;
    var oc = state.orders.filter(function (o) { return o.roundId === r.id; }).length;
    return '<div class="ocard">' +
      '<div class="row" style="gap:6px;flex-wrap:wrap">' +
      '<span class="pill ' + (rs.closed ? 'st-closed' : 'st-paid') + '">' + (rs.closed ? '마감' : '진행중') + '</span>' +
      '<span class="ono">' + esc(fmtDL(r.deadline)) + ' 마감</span></div>' +
      '<div style="font-weight:800;margin-top:6px">' + esc(r.title) + '</div>' +
      '<div class="tiny muted">상품 ' + pc + '개 · 주문 ' + oc + '건' + (r.memo ? ' · ' + esc(r.memo) : '') + '</div>' +
      (rs.closed && rs.expired ? '<div class="tiny muted mt8">마감 시간이 지나 자동으로 마감 표시돼요.</div>' : '') +
      '<div class="row" style="gap:6px;margin-top:10px">' +
      '<button type="button" class="btn sm ghost" data-act="editRound" data-id="' + r.id + '">수정</button>' +
      '<button type="button" class="btn sm ' + (rs.closed ? 'line' : 'ghost') + '" data-act="toggleRound" data-id="' + r.id + '">' + (rs.closed ? '다시 열기' : '마감하기') + '</button>' +
      '</div></div>';
  }

  function productRow(p) {
    var b = badgeInfo(p.badge);
    var out = isSoldOut(p);
    var left = stockLeft(p);
    var st = stockState(p);
    var numTxt = left === null ? '무제한' : (out ? left + '개 · 품절' : left + '개');
    return '<div class="ocard"><div class="row" style="gap:10px">' +
      '<img class="othumb" src="' + p.image + '" alt="">' +
      '<div style="flex:1;min-width:0">' +
      '<div class="sm" style="font-weight:800">' + esc(p.name) + (b.label ? ' <span class="pill ' + STCLS.paid + '" style="font-size:9.5px;padding:2px 6px">' + esc(b.label) + '</span>' : '') + '</div>' +
      '<div class="tiny muted">' + won(p.price) + ' · 매입 ' + yen(p.costJpy) + '</div>' +
      '<div class="tiny muted">' + (p.options && p.options.length ? esc(p.options.join(' / ')) : '옵션 없음') + '</div>' +
      '</div></div>' +
      '<div class="stkbar">' +
      '<span class="lab">재고</span>' +
      '<b class="stkval' + (st === 'out' ? ' out' : st === 'low' ? ' low' : '') + '">' + numTxt + '</b>' +
      (left === null
        ? '<button type="button" class="stkbtn" data-act="editProduct" data-id="' + p.id + '">수량 넣기</button>'
        : '<button type="button" class="stkbtn" data-act="stockAdj" data-id="' + p.id + '" data-d="-1" aria-label="재고 1개 줄이기">−</button>' +
          '<button type="button" class="stkbtn" data-act="stockAdj" data-id="' + p.id + '" data-d="1" aria-label="재고 1개 늘리기">+</button>' +
          '<button type="button" class="stkbtn" data-act="stockAdj" data-id="' + p.id + '" data-d="5" aria-label="재고 5개 늘리기">+5</button>') +
      '<button type="button" class="stkbtn' + (out ? ' on' : '') + '" data-act="stockToggle" data-id="' + p.id + '">' + (out ? '판매 재개' : '품절 처리') + '</button>' +
      '</div>' +
      '<div class="row" style="gap:6px;margin-top:9px">' +
      '<button type="button" class="btn sm ghost" data-act="editProduct" data-id="' + p.id + '">수정</button>' +
      '<button type="button" class="btn sm ghost" data-act="delProduct" data-id="' + p.id + '">삭제</button>' +
      '</div></div>';
  }

  /* ---------- 회원 ---------- */

    var pending = state.members.filter(function (m) { return m.status === 'pending'; });
    var approved = state.members.filter(function (m) { return m.status === 'approved'; });
    var h = '';

    h += '<div class="sechead" style="margin-top:4px"><h2>승인 대기</h2><span class="cnt">' + pending.length + '명</span></div>';
    if (!pending.length) {
      h += '<div class="card"><p class="tiny muted center" style="padding:10px 0">대기 중인 가입 신청이 없어요.</p></div>';
    } else {
      h += pending.map(function (m) {
        return '<div class="ocard">' +
          '<div class="between"><div><b>' + esc(m.name) + '</b> <span class="tiny muted">' + esc(m.nickname || '') + '</span></div>' +
          '<span class="pill st-claim">승인 대기</span></div>' +
          '<div class="tiny muted" style="margin-top:2px">' + esc(m.phone) + ' · ' + ago(m.requestedAt) + ' 신청</div>' +
          '<div class="divider" style="margin:10px 0"></div>' +
          '<div class="acct-line"><span class="k">배송지</span><span class="v">' + esc(m.address) + '</span></div>' +
          '<div class="acct-line"><span class="k">통관부호</span><span class="v">' + esc(maskPccc(m.pccc)) + '</span></div>' +
          '<div class="row" style="gap:6px;margin-top:10px">' +
          '<button type="button" class="btn sm primary" data-act="approve" data-id="' + m.id + '">승인</button>' +
          '<button type="button" class="btn sm ghost" data-act="reject" data-id="' + m.id + '">거절</button>' +
          '</div></div>';
      }).join('');
    }

    h += '<div class="sechead"><h2>승인된 회원</h2><span class="cnt">' + approved.length + '명</span></div>';
    if (!approved.length) {
      h += '<div class="card"><p class="tiny muted center" style="padding:10px 0">아직 승인된 회원이 없어요.</p></div>';
    } else {
      h += approved.map(function (m) {
        var list = state.orders.filter(function (o) { return o.memberId === m.id; });
        var sum = list.reduce(function (s, o) { return s + num(o.total); }, 0);
        return '<div class="ocard"><div class="between">' +
          '<div><b>' + esc(m.name) + '</b> <span class="tiny muted">' + esc(m.nickname || '') + '</span>' +
          '<div class="tiny muted" style="margin-top:2px">' + esc(m.phone) + '</div></div>' +
          '<button type="button" class="btn sm ghost" data-act="memberInfo" data-id="' + m.id + '">정보</button></div>' +
          '<div class="tiny muted mt8">주문 ' + list.length + '건 · 누적 ' + won(sum) + '</div></div>';
      }).join('');
    }

    h += '<div class="sechead"><h2>입금 계좌 · 공지 설정</h2></div>' +
      '<form class="card" data-form="settings">' +
      '<div class="field"><label>입금 계좌</label><input name="account" value="' + esc(state.settings.account) + '" placeholder="은행 + 계좌번호"></div>' +
      '<div class="field"><label>예금주</label><input name="holder" value="' + esc(state.settings.holder) + '"></div>' +

  var EXP_HEAD = ['날짜', '주문자', '상품명', '옵션', '수량', '금액', '입금상태', '회차', '주문번호', '연락처'];

  function exportRows() {
    var list = state.orders.filter(function (o) { return ui.expScope === 'all' || o.roundId === ui.expScope; });
    list.sort(function (a, b) { return dparse(a.createdAt) - dparse(b.createdAt); });
    var rows = [];
    list.forEach(function (o) {
      var m = memberById(o.memberId);
      var r = roundById(o.roundId);
      o.items.forEach(function (it) {
        rows.push([
          fmtDT(o.createdAt), m ? m.name : '알 수 없음', it.name, it.option || '-',
          num(it.qty), num(it.price) * num(it.qty), ST[o.status], r ? r.title : '', o.no, m ? m.phone : ''
        ]);
      });
    });
    return rows;
  }
  function csvCell(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
  function csvText(rows) {
    var all = ui.expHeader ? [EXP_HEAD].concat(rows) : rows;
    return all.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
  }
  function tsvText(rows) {
    var all = ui.expHeader ? [EXP_HEAD].concat(rows) : rows;
    return all.map(function (r) {
      return r.map(function (c) { return String(c == null ? '' : c).replace(/\t/g, ' ').replace(/\r?\n/g, ' '); }).join('\t');
    }).join('\n');
  }

  function setMode(mode) {
    ui.mode = mode;
    ui.detail = null;
    ui.modal = null;

    renderAll();
    try { document.body.classList.remove('modal-open'); } catch (e) {}
